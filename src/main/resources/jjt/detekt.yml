comments:
  # Un KDoc que menciona parámetros que ya no existen miente. Solo se aplica si hay KDoc.
  OutdatedDocumentation:
    active: true

complexity:
  # Mide cuánto cuesta leer una función, no solo cuántos caminos tiene.
  CognitiveComplexMethod:
    active: true
  # Spring inyecta dependencias por constructor.
  LongParameterList:
    allowedConstructorParameters: 8
  # A partir de cuatro argumentos, nombrarlos evita confundir el orden.
  NamedArguments:
    active: true
    allowedArguments: 3

coroutines:
  # Solo se aplican si se usan corrutinas.
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

exceptions:
  # Detecta código pendiente que falla al ejecutarse, como TODO() o throw NotImplementedError().
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  ErrorUsageWithThrowable:
    active: true

potential-bugs:
  # Un else sobre un sealed o un enum oculta los casos nuevos: olvidarse tiene que ser un error de compilación.
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  # Una llamada directa a toString() sobre un valor nullable puede devolver el texto "null".
  NullableToStringCall:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  # Una colección de solo lectura no garantiza que un cast a mutable sea seguro.
  DontDowncastCollectionTypes:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  # Evita propiedades var en data classes.
  DataClassShouldBeImmutable:
    active: true
  # La lista predeterminada prohíbe kotlin.io.print, kotlin.io.println,
  # BigDecimal(Double), BigDecimal(String) y kotlin.system.measureTimeMillis.
  ForbiddenMethodCall:
    active: true
  # Permite comentarios TODO: y rechaza los marcadores FIXME: y STOPSHIP:.
  ForbiddenComment:
    comments:
      - reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.'
        value: 'STOPSHIP:'
  # Los guard clauses son el estilo del proyecto.
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    excludeGuardClauses: true
